<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
<defs>

  <!-- ======== GRADIENTS ======== -->
  <linearGradient id="sceneBackground" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#05060b"/>
    <stop offset="100%" stop-color="#0a0c18"/>
  </linearGradient>

  <radialGradient id="aurora1" cx="22%" cy="30%" r="55%">
    <stop offset="0%"   stop-color="#1a3a6e" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#05060b" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="aurora2" cx="80%" cy="70%" r="55%">
    <stop offset="0%"   stop-color="#2a1a6e" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#05060b" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#f8fafc"/>
    <stop offset="45%"  stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#7c8aa8"/>
  </linearGradient>

  <!-- Aluminium bezel -->
  <linearGradient id="bezelMetal" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#4b5160"/>
    <stop offset="10%"  stop-color="#363b48"/>
    <stop offset="90%"  stop-color="#23262f"/>
    <stop offset="100%" stop-color="#15171e"/>
  </linearGradient>
  <linearGradient id="bezelEdge" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#9aa6b8" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#2b2f3a" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="deckMetal" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#4e5361"/>
    <stop offset="35%"  stop-color="#363a46"/>
    <stop offset="100%" stop-color="#1b1d24"/>
  </linearGradient>
  <linearGradient id="deckFront" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#2b2e38"/>
    <stop offset="100%" stop-color="#101217"/>
  </linearGradient>
  <linearGradient id="hingeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#05060a"/>
    <stop offset="100%" stop-color="#000000"/>
  </linearGradient>

  <linearGradient id="glassA" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#1b2740" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#0e1422" stop-opacity="0.98"/>
  </linearGradient>
  <linearGradient id="glassB" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#241a3d" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#130d22" stop-opacity="0.98"/>
  </linearGradient>

  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="200%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
  </filter>
  <filter id="blurSm" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <filter id="blurMd" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <filter id="glowSm" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>

  <clipPath id="screenClip">
    <rect x="312" y="130" width="576" height="286" rx="4"/>
  </clipPath>

</defs>

<style>
  @keyframes auroraPulse { 0%,100%{opacity:.8;} 50%{opacity:.45;} }
  @keyframes cursorBlink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

  /* Window "opening" pop — scale + fade with a slight spring overshoot */
  @keyframes winPop {
    0%    { opacity: 0; transform: scale(.72); }
    7%    { opacity: 1; transform: scale(1.045); }
    13%   { opacity: 1; transform: scale(1); }
    88%   { opacity: 1; transform: scale(1); }
    96%   { opacity: 0; transform: scale(.9); }
    100%  { opacity: 0; transform: scale(.72); }
  }

  .win { transform-box: fill-box; transform-origin: 50% 50%; }
  .win-main { animation: winPop 7s ease-in-out infinite; }
  .win-a    { animation: winPop 7s ease-in-out infinite; animation-delay: 0.6s; }
  .win-b    { animation: winPop 7s ease-in-out infinite; animation-delay: 1.2s; }

  .aurora1 { animation: auroraPulse 10s ease-in-out infinite; }
  .aurora2 { animation: auroraPulse 13s ease-in-out infinite; animation-delay: -4s; }
  .cursor  { animation: cursorBlink 1s step-end infinite; }

  .t-name {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 900; letter-spacing: -1px;
    fill: url(#titleGrad);
  }
  .mono { font-family: "SF Mono","Fira Code",Menlo,Consolas,monospace; font-size: 11.5px; fill: #cdd6f4; }
  .prompt  { fill: #89b4fa; font-weight: 700; }
  .str     { fill: #a6e3a1; }
  .comment { fill: #6c7086; font-style: italic; }
  .ok      { fill: #a6e3a1; }
  .bar-text{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 9.5px; fill: #94a3b8; }
  .win-title{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; fill: #6b7280; }
  .card-title{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; font-size: 12.5px; fill: #f1f5f9; }
  .card-sub{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; fill: #8891a8; }
</style>

<!-- ================================================ -->
<!-- BACKGROUND                                      -->
<!-- ================================================ -->
<rect width="1200" height="540" fill="url(#sceneBackground)"/>
<ellipse cx="280" cy="150" rx="420" ry="260" fill="url(#aurora1)" class="aurora1"/>
<ellipse cx="930" cy="360" rx="420" ry="260" fill="url(#aurora2)" class="aurora2"/>

<!-- ================================================ -->
<!-- BIG NAME — sits behind the laptop               -->
<!-- ================================================ -->
<text x="600" y="140" text-anchor="middle" class="t-name" font-size="76">HELOISA GARCIA</text>

<!-- ================================================ -->
<!-- LAPTOP SHADOW (contact shadow under the base)   -->
<!-- ================================================ -->
<ellipse cx="600" cy="494" rx="360" ry="14" fill="#000" opacity="0.55" filter="url(#blurMd)"/>
<ellipse cx="600" cy="486" rx="430" ry="10" fill="#38bdf8" opacity="0.05" filter="url(#blurMd)"/>

<!-- ================================================ -->
<!-- SCREEN (front-on, symmetric)                    -->
<!-- ================================================ -->
<rect x="296" y="104" width="608" height="338" rx="22"
      fill="url(#bezelMetal)" stroke="url(#bezelEdge)" stroke-width="1.4"
      filter="url(#softShadow)"/>
<!-- top highlight sliver -->
<path d="M 318 106 Q 600 100 882 106 L 882 110 Q 600 105 318 110 Z" fill="#ffffff" opacity="0.10"/>
<!-- inner screen frame -->
<rect x="308" y="118" width="584" height="300" rx="10" fill="#07080d" stroke="#1c2130" stroke-width="1"/>
<!-- camera notch -->
<rect x="572" y="118" width="56" height="12" rx="6" fill="#05060a"/>
<circle cx="600" cy="124" r="3" fill="#0a0c16" stroke="#232938" stroke-width="0.5"/>
<circle cx="600" cy="124" r="1.4" fill="#1e3a5f"/>

<!-- ================================================ -->
<!-- SCREEN CONTENT (clipped)                        -->
<!-- ================================================ -->
<g clip-path="url(#screenClip)">
  <g transform="translate(312,130)">

    <rect x="0" y="0" width="576" height="286" fill="#0a0c16"/>
    <ellipse cx="90" cy="40" rx="220" ry="130" fill="url(#aurora1)" opacity="0.5"/>
    <ellipse cx="480" cy="230" rx="220" ry="140" fill="url(#aurora2)" opacity="0.4"/>

    <!-- macOS-style menu bar -->
    <rect x="0" y="0" width="576" height="18" fill="#0a0c16" opacity="0.92"/>
    <rect x="0" y="17.5" width="576" height="0.5" fill="#1e293b"/>
    <circle cx="14" cy="9" r="4.2" fill="#8692ab" opacity="0.7"/>
    <text x="26" y="12.5" class="bar-text" font-weight="600" fill="#e2e8f0">Heloisa</text>
    <text x="78" y="12.5" class="bar-text">Terminal</text>
    <text x="128" y="12.5" class="bar-text">Shell</text>
    <text x="440" y="12.5" class="bar-text">Wi-Fi</text>
