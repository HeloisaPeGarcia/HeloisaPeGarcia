<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%">
  <defs>
    <linearGradient id="cardBgMaker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ecfdf5" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="iconMaker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="shadowMaker" x="-30%" y="-30%" width="160%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="308" height="108" rx="18" fill="url(#cardBgMaker)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadowMaker)"/>
  <rect x="6" y="6" width="308" height="108" rx="18" fill="none" stroke="#d1fae5" stroke-width="1"/>

  <circle cx="52" cy="60" r="27" fill="url(#iconMaker)" fill-opacity="0.45"/>
  <circle cx="52" cy="60" r="27" fill="none" stroke="#ffffff" stroke-width="1.4"/>
  <text x="52" y="69" text-anchor="middle" font-size="25">🖨️</text>

  <text x="95" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#1e293b">3D Creator &amp; Maker</text>
  <text x="95" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#059669">3D CAD Modeling</text>
  <text x="95" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">3D Printing &amp; Prototyping</text>

  <rect x="95" y="94" width="40" height="4" rx="2" fill="#34d399" opacity="0.55"/>
  <rect x="139" y="94" width="26" height="4" rx="2" fill="#6ee7b7" opacity="0.4"/>
</svg>
