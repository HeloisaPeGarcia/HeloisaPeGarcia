<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%">
  <defs>
    <linearGradient id="cardBgDevopsD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#1b2a30" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1317" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="iconDevopsD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#1b7389"/>
      <stop offset="100%" stop-color="#124a5c"/>
    </linearGradient>
    <filter id="shadowDevopsD" x="-30%" y="-30%" width="160%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    @keyframes floatCard { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .card-anim { animation: floatCard 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  </style>

  <g class="card-anim">
    <rect x="6" y="6" width="308" height="108" rx="18" fill="url(#cardBgDevopsD)" stroke="#1b7389" stroke-width="1" filter="url(#shadowDevopsD)"/>
    <rect x="6" y="6" width="308" height="108" rx="18" fill="none" stroke="#24343b" stroke-width="1"/>

    <circle cx="52" cy="60" r="27" fill="url(#iconDevopsD)" fill-opacity="0.5"/>
    <circle cx="52" cy="60" r="27" fill="none" stroke="#33444c" stroke-width="1.4"/>
    <text x="52" y="69" text-anchor="middle" font-size="25">☁️</text>

    <text x="95" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#f1f5f9">Cloud &amp; DevOps</text>
    <text x="95" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#7fb8c9">AWS · Azure · Docker</text>
    <text x="95" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Kubernetes · Terraform</text>

    <rect x="95" y="94" width="40" height="4" rx="2" fill="#1b7389" opacity="0.7"/>
    <rect x="139" y="94" width="26" height="4" rx="2" fill="#7fb8c9" opacity="0.5"/>
  </g>
</svg>
