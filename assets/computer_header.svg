      <rect x="218" y="265" width="10" height="10" rx="3" fill="#6ee7b7"/>
      <rect x="233" y="265" width="10" height="10" rx="3" fill="#fca5a5"/>
      <rect x="248" y="265" width="10" height="10" rx="3" fill="#fcd34d"/>
      <rect x="263" y="265" width="10" height="10" rx="3" fill="#93c5fd"/>
      <rect x="283" y="265" width="1" height="10" fill="#334155"/>
