<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
<defs>

  <!-- ======== SIGNATURE PALETTE: Ink Petrol + Coral (dark mode) ======== -->
  <radialGradient id="blob1d" cx="18%" cy="20%" r="50%">
    <stop offset="0%"   stop-color="#1b7389" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#1b7389" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blob2d" cx="85%" cy="75%" r="50%">
    <stop offset="0%"   stop-color="#ff7a59" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#ff7a59" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blob3d" cx="75%" cy="10%" r="40%">
    <stop offset="0%"   stop-color="#ffc24b" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#ffc24b" stop-opacity="0"/>
  </radialGradient>

  <!-- ======== TITLE ======== -->
  <linearGradient id="titleGradD" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"  stop-color="#f1f5f9"/>
    <stop offset="100%" stop-color="#7fb8c9"/>
  </linearGradient>

  <!-- ======== MACBOOK — SPACE-GREY ALUMINIUM ======== -->
  <linearGradient id="lidMetalD" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#3a3f4b"/>
    <stop offset="55%"  stop-color="#2a2e38"/>
    <stop offset="100%" stop-color="#17191f"/>
  </linearGradient>
  <linearGradient id="lidEdgeD" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#6b7280"/>
    <stop offset="100%" stop-color="#2b2f3a" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="deckMetalD" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#40454f"/>
    <stop offset="40%"  stop-color="#2b2f39"/>
    <stop offset="100%" stop-color="#121419"/>
  </linearGradient>
  <linearGradient id="deckFrontD" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#1c1e24"/>
    <stop offset="100%" stop-color="#08090b"/>
  </linearGradient>
  <linearGradient id="hingeGradD" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#4a4f5a"/>
    <stop offset="100%" stop-color="#1a1c22"/>
  </linearGradient>

  <!-- ======== GLASS PANELS (dark glassmorphism) ======== -->
  <linearGradient id="glass1d" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"  stop-color="#1e2733" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#11161d" stop-opacity="0.65"/>
  </linearGradient>
  <linearGradient id="glass2d" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"  stop-color="#1b3a44" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#3a241f" stop-opacity="0.55"/>
  </linearGradient>
  <linearGradient id="screenWashD" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"  stop-color="#141a23"/>
    <stop offset="100%" stop-color="#0b0e13"/>
  </linearGradient>

  <filter id="softShadowD" x="-30%" y="-30%" width="160%" height="200%">
    <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
  </filter>
  <filter id="cardShadowD" x="-40%" y="-40%" width="180%" height="220%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
  </filter>
  <filter id="blurMdD" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>

  <clipPath id="screenClipD">
    <rect x="320" y="158" width="560" height="266" rx="6"/>
  </clipPath>

</defs>

<style>
  @keyframes floatBlob { 0%,100%{ transform: translateY(0px); } 50%{ transform: translateY(-14px); } }
  @keyframes cursorBlink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

  @keyframes winPop {
    0%    { opacity: 0; transform: scale(.85) translateY(10px); }
    8%    { opacity: 1; transform: scale(1.02) translateY(0); }
    15%   { opacity: 1; transform: scale(1) translateY(0); }
    88%   { opacity: 1; transform: scale(1) translateY(0); }
    96%   { opacity: 0; transform: scale(.94) translateY(6px); }
    100%  { opacity: 0; transform: scale(.85) translateY(10px); }
  }

  .win { transform-box: fill-box; transform-origin: 50% 50%; }
  .win-main { animation: winPop 8s ease-in-out infinite; }
  .win-a    { animation: winPop 8s ease-in-out infinite; animation-delay: 0.7s; }

  .blob1 { animation: floatBlob 9s ease-in-out infinite; }
  .blob2 { animation: floatBlob 11s ease-in-out infinite; animation-delay: -3s; }
  .cursor { animation: cursorBlink 1s step-end infinite; }

  .t-name {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 800; letter-spacing: -1px;
    fill: url(#titleGradD);
  }
  .mono { font-family: "SF Mono","Fira Code",Menlo,Consolas,monospace; font-size: 11px; fill: #cbd5e1; }
  .prompt  { fill: #7fb8c9; font-weight: 700; }
  .str     { fill: #5fa8bd; }
  .comment { fill: #64748b; font-style: italic; }
  .ok      { fill: #6ee7b7; }
  .bar-text{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 9.5px; fill: #94a3b8; }
  .win-title{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 9.5px; fill: #94a3b8; }
  .card-title{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; font-size: 13px; fill: #f1f5f9; }
  .card-sub{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; fill: #94a3b8; }
</style>

<!-- ================================================ -->
<!-- MASCOT WATERMARK — abstract "H" monogram        -->
<!-- ================================================ -->
<g transform="translate(600,300) rotate(-8) scale(2.6)" opacity="0.07">
  <rect x="-70" y="-90" width="26" height="180" rx="8" fill="#7fb8c9"/>
  <rect x="44" y="-90" width="26" height="180" rx="8" fill="#7fb8c9"/>
  <path d="M -70 -8 L 70 -28 L 70 12 L -70 32 Z" fill="#ff7a59"/>
</g>

<!-- ================================================ -->
<!-- BACKGROUND                                      -->
<!-- ================================================ -->
<g class="blob1"><ellipse cx="190" cy="140" rx="300" ry="210" fill="url(#blob1d)"/></g>
<g class="blob2"><ellipse cx="1010" cy="410" rx="300" ry="210" fill="url(#blob2d)"/></g>
<ellipse cx="880" cy="90" rx="240" ry="160" fill="url(#blob3d)"/>

<!-- ================================================ -->
<!-- BIG NAME — peeking out from behind the laptop   -->
<!-- ================================================ -->
<text x="600" y="150" text-anchor="middle" class="t-name" font-size="90">HELOISA GARCIA</text>

<!-- ================================================ -->
<!-- LAPTOP SOFT SHADOW                               -->
<!-- ================================================ -->
<ellipse cx="600" cy="518" rx="330" ry="18" fill="#000" opacity="0.45" filter="url(#blurMdD)"/>

<!-- ================================================ -->
<!-- SCREEN — space-grey aluminium lid               -->
<!-- ================================================ -->
<rect x="306" y="134" width="588" height="326" rx="26"
      fill="url(#lidMetalD)" stroke="#44485280" stroke-width="1"
      filter="url(#softShadowD)"/>
<rect x="306.5" y="134.5" width="587" height="30" rx="26" fill="url(#lidEdgeD)" opacity="0.5"/>

<!-- inner black screen frame (thin, modern bezel) -->
<rect x="316" y="144" width="568" height="306" rx="14" fill="#000000"/>
<rect x="320" y="158" width="560" height="266" rx="6" fill="url(#screenWashD)"/>

<!-- camera notch -->
<circle cx="600" cy="150" r="2.4" fill="#000"/>
<circle cx="600" cy="150" r="1" fill="#2c3f5c"/>

<!-- ================================================ -->
<!-- SCREEN CONTENT                                  -->
<!-- ================================================ -->
<g clip-path="url(#screenClipD)">
  <g transform="translate(320,158)">

    <rect x="0" y="0" width="560" height="266" fill="url(#screenWashD)"/>
    <ellipse cx="80" cy="40" rx="200" ry="120" fill="#1b7389" opacity="0.18"/>
    <ellipse cx="470" cy="220" rx="200" ry="130" fill="#ff7a59" opacity="0.12"/>

    <!-- menu bar -->
    <rect x="0" y="0" width="560" height="20" fill="#0b0e13" fill-opacity="0.75"/>
    <rect x="0" y="19.5" width="560" height="0.5" fill="#1e293b"/>
    <circle cx="16" cy="10" r="4.4" fill="#64748b" opacity="0.7"/>
    <text x="28" y="13.5" class="bar-text" font-weight="600" fill="#e2e8f0">Heloisa</text>
    <text x="80" y="13.5" class="bar-text">Terminal</text>
    <text x="440" y="13.5" class="bar-text">Wi-Fi</text>
    <text x="474" y="13.5" class="bar-text">EN</text>
    <text x="502" y="13.5" class="bar-text">11:00</text>

    <!-- ===================== Glass window A: Stack (opens first, back) ===================== -->
    <g transform="translate(340,56)">
    <g class="win win-a">
      <rect x="0" y="0" width="186" height="98" rx="16" fill="url(#glass2d)" stroke="#334155" stroke-width="1" filter="url(#cardShadowD)"/>
      <rect x="0" y="0" width="186" height="98" rx="16" fill="none" stroke="#3a4a52" stroke-width="1" opacity="0.6"/>
      <circle cx="26" cy="30" r="15" fill="#0b0e13" fill-opacity="0.5"/>
      <text x="26" y="35" text-anchor="middle" font-size="15">☁️</text>
      <text x="50" y="27" class="card-title">Cloud &amp; DevOps</text>
      <text x="22" y="58" class="card-sub">AWS · Azure · Kubernetes</text>
      <text x="22" y="74" class="card-sub">Terraform · Docker · GitOps</text>
      <rect x="22" y="82" width="46" height="4" rx="2" fill="#5fa8bd" opacity="0.6"/>
      <rect x="72" y="82" width="34" height="4" rx="2" fill="#ff7a59" opacity="0.6"/>
    </g>
    </g>

    <!-- ===================== Terminal window (opens second, front, centered) ===================== -->
    <g transform="translate(26,34)">
    <g class="win win-main">
      <rect x="0" y="0" width="326" height="196" rx="16" fill="url(#glass1d)" stroke="#334155" stroke-width="1.4" filter="url(#cardShadowD)"/>
      <rect x="0" y="0" width="326" height="196" rx="16" fill="none" stroke="#263241" stroke-width="1"/>
      <rect x="0" y="0" width="326" height="26" rx="16" fill="#0b0e13" fill-opacity="0.55"/>
      <rect x="0" y="16" width="326" height="10" fill="#0b0e13" fill-opacity="0.45"/>
      <circle cx="16" cy="13" r="4.4" fill="#ff5f57"/>
      <circle cx="30" cy="13" r="4.4" fill="#febc2e"/>
      <circle cx="44" cy="13" r="4.4" fill="#28c840"/>
      <text x="163" y="17" text-anchor="middle" class="win-title">zsh — heloisa@macbook</text>

      <g transform="translate(18,48)" class="mono">
        <text x="0" y="0"><tspan class="prompt">➜</tspan><tspan fill="#5fa8bd" dx="4">~</tspan><tspan fill="#7fb8c9" dx="4">git:(</tspan><tspan fill="#ff7a59">main</tspan><tspan fill="#7fb8c9">)</tspan></text>
        <text x="0" y="20"><tspan class="prompt">$</tspan><tspan dx="6" fill="#cbd5e1">whoami</tspan><tspan class="str" dx="4">--role</tspan></text>
        <text x="0" y="42" fill="#f1f5f9" font-weight="600">Heloisa Pe Garcia</text>
        <text x="0" y="60" fill="#94a3b8">Software Developer · DevOps &amp; Cloud</text>
        <line x1="0" y1="72" x2="296" y2="72" stroke="#263241" stroke-width="1"/>
        <text x="0" y="92"><tspan class="prompt">$</tspan><tspan dx="6" fill="#cbd5e1">kubectl apply</tspan><tspan class="str" dx="4">-f deploy.yaml</tspan></text>
        <text x="0" y="112" class="ok">✔ 3/3 replicas ready ⚡</text>
        <text x="0" y="132"><tspan class="prompt">$</tspan><tspan dx="6" fill="#cbd5e1">open</tspan><tspan class="str" dx="4">--new-ideas</tspan></text>
        <text x="0" y="150" class="comment"># loading next project...</text>
        <rect x="0" y="158" width="7" height="13" fill="#ff7a59" class="cursor"/>
      </g>
    </g>
    </g>
  </g>
</g>

<!-- subtle glare on screen -->
<g clip-path="url(#screenClipD)" opacity="0.04">
  <path d="M 320 158 L 520 158 L 320 300 Z" fill="#ffffff"/>
</g>

<!-- ================================================ -->
<!-- HINGE                                             -->
<!-- ================================================ -->
<rect x="340" y="454" width="520" height="10" rx="4" fill="url(#hingeGradD)"/>
<rect x="340" y="454" width="520" height="2" fill="#7f8694" opacity="0.4"/>

<!-- ================================================ -->
<!-- KEYBOARD DECK — space-grey aluminium, trapezoid  -->
<!-- ================================================ -->
<path d="M 344 464 L 856 464 L 924 500 L 276 500 Z" fill="url(#deckMetalD)" stroke="#05060a" stroke-width="1"/>
<path d="M 344 464 L 856 464 L 852 468 L 348 468 Z" fill="#7f8694" opacity="0.3"/>
<path d="M 276 500 L 924 500 L 924 505 Q 600 510 276 505 Z" fill="url(#deckFrontD)"/>

<!-- minimal keyboard suggestion — just a soft rounded well, no literal keys (clean look) -->
<path d="M 362 470 L 838 470 L 892 492 L 308 492 Z" fill="#14161b" opacity="0.7"/>

<!-- trackpad -->
<path d="M 548 496 L 652 496 L 660 512 L 540 512 Z" fill="#1a1c22" fill-opacity="0.7" stroke="#05060a" stroke-width="1"/>

</svg>
