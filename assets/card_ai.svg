<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%">
  <defs>
    <linearGradient id="cardBgAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fff3e0" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="iconAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ffdca3"/>
      <stop offset="100%" stop-color="#ffc24b"/>
    </linearGradient>
    <filter id="shadowAI" x="-30%" y="-30%" width="160%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b2b36" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseIcon { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.85; } }
    .icon-anim { animation: pulseIcon 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  </style>

  <rect x="6" y="6" width="308" height="108" rx="18" fill="url(#cardBgAI)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadowAI)"/>
  <rect x="6" y="6" width="308" height="108" rx="18" fill="none" stroke="#ffe8c2" stroke-width="1"/>

  <g class="icon-anim">
    <circle cx="52" cy="60" r="27" fill="url(#iconAI)" fill-opacity="0.45"/>
    <circle cx="52" cy="60" r="27" fill="none" stroke="#ffffff" stroke-width="1.4"/>
    <text x="52" y="69" text-anchor="middle" font-size="25">🤖</text>
  </g>

  <text x="95" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#0b2b36">AI &amp; Software Eng</text>
  <text x="95" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#b8762a">Python · Java · PyTorch</text>
  <text x="95" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">TensorFlow · Databases</text>

  <rect x="95" y="94" width="40" height="4" rx="2" fill="#ffc24b" opacity="0.6"/>
  <rect x="139" y="94" width="26" height="4" rx="2" fill="#ffdca3" opacity="0.45"/>
</svg>
