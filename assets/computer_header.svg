<path d="M 334 450 L 866 450 L 946 494 L 254 494 Z" fill="url(#deckMetal)" stroke="#0c0d12" stroke-width="1"/>
<!-- top edge highlight -->
<path d="M 334 450 L 866 450 L 862 454 L 338 454 Z" fill="#9aa6b8" opacity="0.3"/>
<!-- front face (thickness) -->
<path d="M 254 494 L 946 494 L 946 500 Q 600 506 254 500 Z" fill="url(#deckFront)"/>
<path d="M 254 494 L 946 494" stroke="#000" stroke-width="1" opacity="0.4"/>

<!-- keyboard well + abstracted keys, clipped to deck trapezoid -->
