<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%">
  <defs>
    <linearGradient id="cardBgMakerD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#2a1c17" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#15100c" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="iconMakerD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ff7a59"/>
      <stop offset="100%" stop-color="#c2491f"/>
    </linearGradient>
    <linearGradient id="shimmerGradD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadowMakerD" x="-30%" y="-30%" width="160%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="cardClipMakerD">
      <rect x="6" y="6" width="308" height="108" rx="18"/>
    </clipPath>
  </defs>

  <style>
    @keyframes shimmerSweep {
      0%   { transform: translateX(-140px) skewX(-18deg); opacity: 0; }
      8%   { opacity: 0.9; }
      35%  { opacity: 0.9; }
      48%  { transform: translateX(360px) skewX(-18deg); opacity: 0; }
      100% { transform: translateX(360px) skewX(-18deg); opacity: 0; }
    }
    .shimmer { animation: shimmerSweep 4.5s ease-in-out infinite; }
  </style>

  <rect x="6" y="6" width="308" height="108" rx="18" fill="url(#cardBgMakerD)" stroke="#ff7a59" stroke-width="1" filter="url(#shadowMakerD)"/>
  <rect x="6" y="6" width="308" height="108" rx="18" fill="none" stroke="#3a241c" stroke-width="1"/>

  <circle cx="52" cy="60" r="27" fill="url(#iconMakerD)" fill-opacity="0.5"/>
  <circle cx="52" cy="60" r="27" fill="none" stroke="#4a2e22" stroke-width="1.4"/>
  <text x="52" y="69" text-anchor="middle" font-size="25">🖨️</text>

  <text x="95" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#f1f5f9">3D Creator &amp; Maker</text>
  <text x="95" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#ff7a59">3D CAD Modeling</text>
  <text x="95" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">3D Printing &amp; Prototyping</text>

  <rect x="95" y="94" width="40" height="4" rx="2" fill="#ff7a59" opacity="0.7"/>
  <rect x="139" y="94" width="26" height="4" rx="2" fill="#ffb49c" opacity="0.5"/>

  <g clip-path="url(#cardClipMakerD)">
    <rect class="shimmer" x="0" y="0" width="40" height="120" fill="url(#shimmerGradD)"/>
  </g>
</svg>
