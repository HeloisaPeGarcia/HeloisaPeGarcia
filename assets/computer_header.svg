    <!-- ===================== Window A: Cloud & DevOps (opens first, back-right) ===================== -->
    <g transform="translate(354,24)">
    <g class="win win-a">
      <rect x="2" y="5" width="206" height="92" rx="11" fill="#000" opacity="0.4" filter="url(#blurSm)"/>
      <rect x="0" y="0" width="206" height="92" rx="11" fill="url(#glassA)" stroke="#27456e" stroke-width="1"/>
      <rect x="0" y="0" width="206" height="20" rx="11" fill="#101a2c"/>
      <rect x="0" y="12" width="206" height="8" fill="#101a2c"/>
      <circle cx="12" cy="10" r="3.4" fill="#ff5f57"/>
      <circle cx="23" cy="10" r="3.4" fill="#febc2e"/>
      <circle cx="34" cy="10" r="3.4" fill="#28c840"/>
      <text x="103" y="13.5" text-anchor="middle" class="win-title">devops.sh</text>
      <text x="16" y="42" font-size="16">☁️</text>
      <text x="40" y="39" class="card-title">Cloud &amp; DevOps</text>
      <text x="16" y="60" class="card-sub">AWS · Azure · Kubernetes</text>
      <text x="16" y="74" class="card-sub">Terraform · Docker · GitOps</text>
    </g>
    </g>

    <!-- ===================== Window B: AI & Software (opens second, back-right lower) ===================== -->
    <g transform="translate(366,150)">
