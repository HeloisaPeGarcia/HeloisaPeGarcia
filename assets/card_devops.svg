<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%">
  <defs>
    <linearGradient id="cardBgDevops" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#eef2ff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="iconDevops" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="shadowDevops" x="-30%" y="-30%" width="160%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="308" height="108" rx="18" fill="url(#cardBgDevops)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadowDevops)"/>
  <rect x="6" y="6" width="308" height="108" rx="18" fill="none" stroke="#dbeafe" stroke-width="1"/>

  <circle cx="52" cy="60" r="27" fill="url(#iconDevops)" fill-opacity="0.45"/>
  <circle cx="52" cy="60" r="27" fill="none" stroke="#ffffff" stroke-width="1.4"/>
  <text x="52" y="69" text-anchor="middle" font-size="25">☁️</text>

  <text x="95" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#1e293b">Cloud &amp; DevOps</text>
  <text x="95" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#2563eb">AWS · Azure · Docker</text>
  <text x="95" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Kubernetes · Terraform</text>

  <rect x="95" y="94" width="40" height="4" rx="2" fill="#60a5fa" opacity="0.55"/>
  <rect x="139" y="94" width="26" height="4" rx="2" fill="#93c5fd" opacity="0.4"/>
