<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="100%" height="100%">
  <defs>
    <!-- Mac Space Gray Metallic Gradients -->
    <linearGradient id="macBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="50%" stop-color="#1c1f26"/>
      <stop offset="100%" stop-color="#12141a"/>
    </linearGradient>

    <linearGradient id="macBezelHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="macStand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#383d4a"/>
      <stop offset="50%" stop-color="#222630"/>
      <stop offset="100%" stop-color="#14171f"/>
    </linearGradient>

    <!-- macOS Dark Sonoma Abstract Wallpaper Gradient -->
    <linearGradient id="macScreenWallpaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="40%" stop-color="#111827"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glassmorphism Card Fill -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="textSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Subtle Shadows & Blurs -->
    <filter id="macShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes floatA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatC {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.35; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    .animated-float-a { animation: floatA 6s ease-in-out indefinite; }
    .animated-float-b { animation: floatB 7s ease-in-out indefinite; }
    .animated-float-c { animation: floatC 8s ease-in-out indefinite; }
    .animated-pulse { animation: pulseGlow 4s ease-in-out indefinite; }
    .animated-cursor { animation: blink 1s step-end indefinite; }

    /* Typography */
    .mac-title-bg {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 78px;
      letter-spacing: 6px;
      fill: url(#textSilver);
    }
    .mac-sub-bg {
      font-family: 'SF Pro Text', -apple-system, sans-serif;
      font-weight: 500;
      font-size: 18px;
      letter-spacing: 8px;
      fill: #94a3b8;
      opacity: 0.5;
    }
    .term-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 500; fill: #94a3b8; }
    .term-text { font-family: 'SF Mono', 'Fira Code', Menlo, monospace; font-size: 13px; fill: #e2e8f0; }
    .t-prompt { fill: #38bdf8; font-weight: 600; }
    .t-key { fill: #818cf8; }
    .t-val { fill: #34d399; }
    .t-accent { fill: #f43f5e; }
    .card-head { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 12px; fill: #94a3b8; }
  </style>

  <!-- Ground Reflection & Ambient Shadows -->
  <ellipse cx="500" cy="495" rx="440" ry="18" fill="#38bdf8" class="animated-pulse" filter="url(#softGlow)"/>
  <ellipse cx="500" cy="495" rx="460" ry="14" fill="#000000" opacity="0.85"/>

  <!-- Mac Stand (Mac Studio Display Aluminum Stand) -->
  <path d="M 410 485 L 590 485 L 560 410 L 440 410 Z" fill="url(#macStand)" stroke="#334155" stroke-width="1"/>
  <path d="M 440 410 L 560 410 L 555 420 L 445 420 Z" fill="#475569" opacity="0.4"/>
  
  <!-- Stand Base Lip -->
  <rect x="410" y="482" width="180" height="4" rx="2" fill="#64748b"/>

  <!-- Mac Display Body Frame (Pro Display XDR style) -->
  <rect x="40" y="15" width="920" height="405" rx="18" fill="url(#macBody)" filter="url(#macShadow)" stroke="url(#macBezelHighlight)" stroke-width="1.5"/>

  <!-- Screen Bezel Outer Inner Chamfer -->
  <rect x="48" y="23" width="904" height="389" rx="12" fill="#090a0f" stroke="#1e293b" stroke-width="1"/>

  <!-- Mac FaceTime Camera Notch / Sensor Array -->
  <rect x="470" y="23" width="60" height="12" rx="6" fill="#161922"/>
  <circle cx="492" cy="29" r="3" fill="#06080c" stroke="#272b36" stroke-width="0.8"/>
  <circle cx="508" cy="29" r="1.5" fill="#10b981"/> <!-- Green Status LED -->

  <!-- ==================== DISPLAY SCREEN AREA ==================== -->
  <rect x="54" y="38" width="892" height="364" rx="8" fill="url(#macScreenWallpaper)"/>

  <!-- Soft Ambient Geometric Glow inside Screen -->
  <circle cx="200" cy="120" r="180" fill="#38bdf8" opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="800" cy="300" r="200" fill="#6366f1" opacity="0.08" filter="url(#softGlow)"/>

  <!-- BACKGROUND WATERMARK: Mac Sonoma Style Typography -->
  <g transform="translate(500, 145)" text-anchor="middle">
    <!-- Animated Soft Pulsing Watermark -->
    <text x="0" y="0" class="mac-title-bg animated-pulse">HELOISA GARCIA</text>
    <text x="0" y="36" class="mac-sub-bg">SOFTWARE DEVELOPER  •  DEVOPS  •  CLOUD  •  AI</text>
  </g>

  <!-- Subtle Subtle Grid overlay -->
  <path d="M 54 130 L 946 130 M 54 220 L 946 220 M 54 310 L 946 310" stroke="#334155" stroke-width="0.8" opacity="0.12"/>

  <!-- ==================== FOREGROUND ELEMENT 1: macOS Terminal Window ==================== -->
  <g transform="translate(80, 80)" class="animated-float-a">
    <!-- Terminal Outer Frame with Drop Shadow -->
    <rect x="0" y="0" width="510" height="295" rx="10" fill="#0c0e14" fill-opacity="0.94" stroke="#334155" stroke-width="1.2" filter="url(#macShadow)"/>
    
    <!-- macOS Window Header Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 500 0 Q 510 0 510 10 L 510 32 L 0 32 Z" fill="#161922"/>
    
    <!-- macOS Traffic Light Buttons -->
    <circle cx="18" cy="16" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="34" cy="16" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
    <circle cx="50" cy="16" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>
    
    <text x="255" y="20" text-anchor="middle" class="term-title">heloisa@macbook-pro:~ (zsh)</text>

    <!-- Terminal Inner Buffer -->
    <g transform="translate(20, 56)" class="term-text">
      <text x="0" y="0"><tspan class="t-prompt">heloisa@macbook-pro %</tspan> systeminfo --fetch</text>
      
      <line x1="0" y1="12" x2="470" y2="12" stroke="#1e293b" stroke-width="1"/>

      <text x="0" y="34"><tspan class="t-key">Developer:</tspan> Heloisa Pe Garcia</text>
      <text x="0" y="56"><tspan class="t-key">Location:</tspan> São Paulo, SP - Brazil 🇧🇷</text>
      <text x="0" y="78"><tspan class="t-key">Focus:</tspan> Software Engineering, DevOps &amp; Cloud</text>
      <text x="0" y="100"><tspan class="t-key">Stack:</tspan> Python, Java, JS, AWS, Azure, K8s, Docker</text>
      <text x="0" y="122"><tspan class="t-key">AI &amp; Data:</tspan> PyTorch, TensorFlow, Oracle, MySQL</text>
      <text x="0" y="144"><tspan class="t-key">Maker Lab:</tspan> 3D Modeling &amp; Hardware Prototyping 🖨️</text>

      <text x="0" y="178"><tspan class="t-prompt">heloisa@macbook-pro %</tspan> ./run_pipeline.sh</text>
      <text x="0" y="200" fill="#34d399">✔ All services operational. Ready for innovation! ⚡</text>
      
      <!-- Animated Blinking Cursor -->
      <rect x="365" y="189" width="8" height="15" fill="#38bdf8" class="animated-cursor"/>
    </g>
  </g>

  <!-- ==================== FOREGROUND ELEMENT 2: Animated Floating Cards ==================== -->
  
  <!-- Card A: Cloud & Infrastructure -->
  <g transform="translate(625, 85)" class="animated-float-b">
    <rect x="0" y="0" width="285" height="80" rx="12" fill="url(#glassCard)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" filter="url(#macShadow)"/>
    <circle cx="40" cy="40" r="22" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <text x="40" y="46" text-anchor="middle" font-size="20">☁️</text>
    <text x="78" y="35" class="card-head">Cloud &amp; DevOps</text>
    <text x="78" y="55" class="card-desc">AWS, Azure, K8s, Terraform</text>
  </g>

  <!-- Card B: Software & AI -->
  <g transform="translate(625, 180)" class="animated-float-c">
    <rect x="0" y="0" width="285" height="80" rx="12" fill="url(#glassCard)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" filter="url(#macShadow)"/>
    <circle cx="40" cy="40" r="22" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1"/>
    <text x="40" y="46" text-anchor="middle" font-size="20">🤖</text>
    <text x="78" y="35" class="card-head">Software &amp; AI</text>
    <text x="78" y="55" class="card-desc">Python, Java, PyTorch, ML</text>
  </g>

  <!-- Card C: 3D Creator & Maker -->
  <g transform="translate(625, 275)" class="animated-float-a">
    <rect x="0" y="0" width="285" height="80" rx="12" fill="url(#glassCard)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.5" filter="url(#macShadow)"/>
    <circle cx="40" cy="40" r="22" fill="#047857" fill-opacity="0.3" stroke="#34d399" stroke-width="1"/>
    <text x="40" y="46" text-anchor="middle" font-size="20">🖨️</text>
    <text x="78" y="35" class="card-head">3D Creator &amp; Maker</text>
    <text x="78" y="55" class="card-desc">3D CAD Design &amp; Prototyping</text>
  </g>

</svg>
