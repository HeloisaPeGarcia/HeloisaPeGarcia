<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%">
  <defs>
    <linearGradient id="cardBgAID" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#2a2318" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#15120c" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="iconAID" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ffc24b"/>
      <stop offset="100%" stop-color="#b8762a"/>
    </linearGradient>
    <filter id="shadowAID" x="-30%" y="-30%" width="160%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseIcon { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.85; } }
    .icon-anim { animation: pulseIcon 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  </style>

  <rect x="6" y="6" width="308" height="108" rx="18" fill="url(#cardBgAID)" stroke="#ffc24b" stroke-width="1" filter="url(#shadowAID)"/>
  <rect x="6" y="6" width="308" height="108" rx="18" fill="none" stroke="#3a3020" stroke-width="1"/>

  <g class="icon-anim">
    <circle cx="52" cy="60" r="27" fill="url(#iconAID)" fill-opacity="0.5"/>
    <circle cx="52" cy="60" r="27" fill="none" stroke="#4a3d26" stroke-width="1.4"/>
    <text x="52" y="69" text-anchor="middle" font-size="25">🤖</text>
  </g>

  <text x="95" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#f1f5f9">AI &amp; Software Eng</text>
  <text x="95" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#ffc24b">Python · Java · PyTorch</text>
  <text x="95" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">TensorFlow · Databases</text>

  <rect x="95" y="94" width="40" height="4" rx="2" fill="#ffc24b" opacity="0.7"/>
  <rect x="139" y="94" width="26" height="4" rx="2" fill="#ffdca3" opacity="0.5"/>
</svg>
