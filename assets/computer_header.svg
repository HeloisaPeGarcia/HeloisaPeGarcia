      <rect x="2" y="5" width="196" height="88" rx="11" fill="#000" opacity="0.4" filter="url(#blurSm)"/>
      <rect x="0" y="0" width="196" height="88" rx="11" fill="url(#glassB)" stroke="#432a74" stroke-width="1"/>
