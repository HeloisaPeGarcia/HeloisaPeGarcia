<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
<defs>

  <!-- ======== SIGNATURE PALETTE: Ink Petrol + Coral ======== -->
  <!-- petrol-900 #0b2b36 · petrol-700 #124a5c · petrol-500 #1b7389 · petrol-300 #7fb8c9 -->
  <!-- coral-500  #ff7a59 · coral-300  #ffb49c · amber-400  #ffc24b                     -->

  <!-- ======== BACKGROUND ACCENTS (translucent, no base fill) ======== -->
  <radialGradient id="blob1" cx="18%" cy="20%" r="50%">
    <stop offset="0%"   stop-color="#7fb8c9" stop-opacity="0.40"/>
    <stop offset="100%" stop-color="#7fb8c9" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blob2" cx="85%" cy="75%" r="50%">
    <stop offset="0%"   stop-color="#ffb49c" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#ffb49c" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blob3" cx="75%" cy="10%" r="40%">
    <stop offset="0%"   stop-color="#ffc24b" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#ffc24b" stop-opacity="0"/>
  </radialGradient>

  <!-- ======== TITLE ======== -->
  <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"  stop-color="#0b2b36"/>
    <stop offset="100%" stop-color="#5a8a97"/>
  </linearGradient>

  <!-- ======== MACBOOK — WHITE ALUMINIUM ======== -->
  <linearGradient id="lidMetal" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#ffffff"/>
    <stop offset="55%"  stop-color="#f3f4f8"/>
    <stop offset="100%" stop-color="#dfe2ea"/>
  </linearGradient>
  <linearGradient id="lidEdge" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#c7cbd6" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="deckMetal" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#fbfbfd"/>
    <stop offset="40%"  stop-color="#e9ebf1"/>
    <stop offset="100%" stop-color="#cdd1dc"/>
  </linearGradient>
  <linearGradient id="deckFront" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#c3c7d2"/>
    <stop offset="100%" stop-color="#9ea3b1"/>
  </linearGradient>
  <linearGradient id="hingeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#b9bdc8"/>
    <stop offset="100%" stop-color="#8c91a0"/>
  </linearGradient>

  <!-- ======== GLASS PANELS (glassmorphism) ======== -->
  <linearGradient id="glass1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
  </linearGradient>
  <linearGradient id="glass2" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"  stop-color="#dbeafe" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#ffe4d9" stop-opacity="0.3"/>
  </linearGradient>
  <linearGradient id="screenWash" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"  stop-color="#eef2ff"/>
    <stop offset="100%" stop-color="#f8fafc"/>
  </linearGradient>

  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="200%">
    <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1e293b" flood-opacity="0.18"/>
  </filter>
  <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="220%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.12"/>
  </filter>
  <filter id="blurMd" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>

  <clipPath id="screenClip">
    <rect x="320" y="158" width="560" height="266" rx="6"/>
  </clipPath>

</defs>

<style>
  @keyframes floatBlob { 0%,100%{ transform: translateY(0px); } 50%{ transform: translateY(-14px); } }
  @keyframes cursorBlink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

  @keyframes winPop {
    0%    { opacity: 0; transform: scale(.85) translateY(10px); }
    8%    { opacity: 1; transform: scale(1.02) translateY(0); }
    15%   { opacity: 1; transform: scale(1) translateY(0); }
    88%   { opacity: 1; transform: scale(1) translateY(0); }
    96%   { opacity: 0; transform: scale(.94) translateY(6px); }
    100%  { opacity: 0; transform: scale(.85) translateY(10px); }
  }

  .win { transform-box: fill-box; transform-origin: 50% 50%; }
  .win-main { animation: winPop 8s ease-in-out infinite; }
  .win-a    { animation: winPop 8s ease-in-out infinite; animation-delay: 0.7s; }

  .blob1 { animation: floatBlob 9s ease-in-out infinite; }
  .blob2 { animation: floatBlob 11s ease-in-out infinite; animation-delay: -3s; }
  .cursor { animation: cursorBlink 1s step-end infinite; }

  .t-name {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 800; letter-spacing: -1px;
    fill: url(#titleGrad);
  }
  .mono { font-family: "SF Mono","Fira Code",Menlo,Consolas,monospace; font-size: 11px; fill: #334155; }
  .prompt  { fill: #124a5c; font-weight: 700; }
  .str     { fill: #1b7389; }
  .comment { fill: #94a3b8; font-style: italic; }
  .ok      { fill: #059669; }
  .bar-text{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 9.5px; fill: #64748b; }
  .win-title{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 9.5px; fill: #64748b; }
  .card-title{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; }
  .card-sub{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; fill: #64748b; }
</style>

<!-- ================================================ -->
<!-- MASCOT WATERMARK — abstract "H" monogram        -->
<!-- ================================================ -->
<g transform="translate(600,300) rotate(-8) scale(2.6)" opacity="0.055">
  <rect x="-70" y="-90" width="26" height="180" rx="8" fill="#0b2b36"/>
  <rect x="44" y="-90" width="26" height="180" rx="8" fill="#0b2b36"/>
  <path d="M -70 -8 L 70 -28 L 70 12 L -70 32 Z" fill="#ff7a59"/>
</g>

<!-- ================================================ -->
<!-- BACKGROUND                                      -->
<!-- ================================================ -->
<g class="blob1"><ellipse cx="190" cy="140" rx="300" ry="210" fill="url(#blob1)"/></g>
<g class="blob2"><ellipse cx="1010" cy="410" rx="300" ry="210" fill="url(#blob2)"/></g>
<ellipse cx="880" cy="90" rx="240" ry="160" fill="url(#blob3)"/>

<!-- ================================================ -->
<!-- BIG NAME — peeking out from behind the laptop   -->
<!-- ================================================ -->
<text x="600" y="150" text-anchor="middle" class="t-name" font-size="90">HELOISA GARCIA</text>

<!-- ================================================ -->
<!-- LAPTOP SOFT SHADOW                               -->
<!-- ================================================ -->
<ellipse cx="600" cy="518" rx="330" ry="18" fill="#1e293b" opacity="0.14" filter="url(#blurMd)"/>

<!-- ================================================ -->
<!-- SCREEN — white aluminium lid                    -->
<!-- ================================================ -->
<rect x="306" y="134" width="588" height="326" rx="26"
      fill="url(#lidMetal)" stroke="#d7dbe4" stroke-width="1"
      filter="url(#softShadow)"/>
<rect x="306.5" y="134.5" width="587" height="30" rx="26" fill="url(#lidEdge)" opacity="0.8"/>

<!-- inner black screen frame (thin, modern bezel) -->
<rect x="316" y="144" width="568" height="306" rx="14" fill="#0b0d12"/>
<rect x="320" y="158" width="560" height="266" rx="6" fill="url(#screenWash)"/>

<!-- camera notch -->
<circle cx="600" cy="150" r="2.4" fill="#1a1d24"/>
<circle cx="600" cy="150" r="1" fill="#2c3f5c"/>

<!-- ================================================ -->
<!-- SCREEN CONTENT                                  -->
<!-- ================================================ -->
<g clip-path="url(#screenClip)">
  <g transform="translate(320,158)">

    <rect x="0" y="0" width="560" height="266" fill="url(#screenWash)"/>
    <ellipse cx="80" cy="40" rx="200" ry="120" fill="#bfdbfe" opacity="0.35"/>
    <ellipse cx="470" cy="220" rx="200" ry="130" fill="#ddd6fe" opacity="0.3"/>

    <!-- menu bar -->
    <rect x="0" y="0" width="560" height="20" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="0" y="19.5" width="560" height="0.5" fill="#e2e8f0"/>
    <circle cx="16" cy="10" r="4.4" fill="#94a3b8" opacity="0.6"/>
    <text x="28" y="13.5" class="bar-text" font-weight="600" fill="#334155">Heloisa</text>
    <text x="80" y="13.5" class="bar-text">Terminal</text>
    <text x="440" y="13.5" class="bar-text">Wi-Fi</text>
    <text x="474" y="13.5" class="bar-text">EN</text>
    <text x="502" y="13.5" class="bar-text">11:00</text>

    <!-- ===================== Glass window A: Stack (opens first, back) ===================== -->
    <g transform="translate(340,56)">
    <g class="win win-a">
      <rect x="0" y="0" width="186" height="98" rx="16" fill="url(#glass2)" stroke="#ffffff" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="186" height="98" rx="16" fill="none" stroke="#c7d2fe" stroke-width="1" opacity="0.6"/>
      <circle cx="26" cy="30" r="15" fill="#ffffff" fill-opacity="0.7"/>
      <text x="26" y="35" text-anchor="middle" font-size="15">☁️</text>
      <text x="50" y="27" class="card-title">Cloud &amp; DevOps</text>
      <text x="22" y="58" class="card-sub">AWS · Azure · Kubernetes</text>
      <text x="22" y="74" class="card-sub">Terraform · Docker · GitOps</text>
      <rect x="22" y="82" width="46" height="4" rx="2" fill="#1b7389" opacity="0.5"/>
      <rect x="72" y="82" width="34" height="4" rx="2" fill="#ff7a59" opacity="0.5"/>
    </g>
    </g>

    <!-- ===================== Terminal window (opens second, front, centered) ===================== -->
    <g transform="translate(26,34)">
    <g class="win win-main">
      <rect x="0" y="0" width="326" height="196" rx="16" fill="url(#glass1)" stroke="#ffffff" stroke-width="1.4" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="326" height="196" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="0" y="0" width="326" height="26" rx="16" fill="#ffffff" fill-opacity="0.55"/>
      <rect x="0" y="16" width="326" height="10" fill="#ffffff" fill-opacity="0.45"/>
      <circle cx="16" cy="13" r="4.4" fill="#ff5f57"/>
      <circle cx="30" cy="13" r="4.4" fill="#febc2e"/>
      <circle cx="44" cy="13" r="4.4" fill="#28c840"/>
      <text x="163" y="17" text-anchor="middle" class="win-title">zsh — heloisa@macbook</text>

      <g transform="translate(18,48)" class="mono">
        <text x="0" y="0"><tspan class="prompt">➜</tspan><tspan fill="#1b7389" dx="4">~</tspan><tspan fill="#124a5c" dx="4">git:(</tspan><tspan fill="#ff7a59">main</tspan><tspan fill="#124a5c">)</tspan></text>
        <text x="0" y="20"><tspan class="prompt">$</tspan><tspan dx="6" fill="#334155">whoami</tspan><tspan class="str" dx="4">--role</tspan></text>
        <text x="0" y="42" fill="#1e293b" font-weight="600">Heloisa Pe Garcia</text>
        <text x="0" y="60" fill="#475569">Software Developer · DevOps &amp; Cloud</text>
        <line x1="0" y1="72" x2="296" y2="72" stroke="#e2e8f0" stroke-width="1"/>
        <text x="0" y="92"><tspan class="prompt">$</tspan><tspan dx="6" fill="#334155">kubectl apply</tspan><tspan class="str" dx="4">-f deploy.yaml</tspan></text>
        <text x="0" y="112" class="ok">✔ 3/3 replicas ready ⚡</text>
        <text x="0" y="132"><tspan class="prompt">$</tspan><tspan dx="6" fill="#334155">open</tspan><tspan class="str" dx="4">--new-ideas</tspan></text>
        <text x="0" y="150" class="comment"># loading next project...</text>
        <rect x="0" y="158" width="7" height="13" fill="#ff7a59" class="cursor"/>
      </g>
    </g>
    </g>
  </g>
</g>

<!-- subtle glare on screen -->
<g clip-path="url(#screenClip)" opacity="0.08">
  <path d="M 320 158 L 520 158 L 320 300 Z" fill="#ffffff"/>
</g>

<!-- ================================================ -->
<!-- HINGE                                             -->
<!-- ================================================ -->
<rect x="340" y="454" width="520" height="10" rx="4" fill="url(#hingeGrad)"/>
<rect x="340" y="454" width="520" height="2" fill="#ffffff" opacity="0.5"/>

<!-- ================================================ -->
<!-- KEYBOARD DECK — white aluminium, trapezoid       -->
<!-- ================================================ -->
<path d="M 344 464 L 856 464 L 924 500 L 276 500 Z" fill="url(#deckMetal)" stroke="#cdd1dc" stroke-width="1"/>
<path d="M 344 464 L 856 464 L 852 468 L 348 468 Z" fill="#ffffff" opacity="0.6"/>
<path d="M 276 500 L 924 500 L 924 505 Q 600 510 276 505 Z" fill="url(#deckFront)"/>

<!-- minimal keyboard suggestion — just a soft rounded well, no literal keys (clean look) -->
<path d="M 362 470 L 838 470 L 892 492 L 308 492 Z" fill="#dde1ea" opacity="0.55"/>

<!-- trackpad -->
<path d="M 548 496 L 652 496 L 660 512 L 540 512 Z" fill="#ffffff" fill-opacity="0.5" stroke="#cdd1dc" stroke-width="1"/>

</svg>
