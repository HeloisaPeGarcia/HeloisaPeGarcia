      <circle cx="34" cy="10" r="3.4" fill="#28c840"/>
      <text x="98" y="13.5" text-anchor="middle" class="win-title">ai_lab.py</text>
      <text x="16" y="40" font-size="16">🤖</text>
      <text x="40" y="37" class="card-title">AI &amp; Software</text>
      <text x="16" y="57" class="card-sub">Python · PyTorch</text>
      <text x="16" y="71" class="card-sub">MLOps · LLM Agents</text>
    </g>
    </g>

    <!-- ===================== Terminal window (opens last, in front, centered-left) ===================== -->
    <g transform="translate(16,34)">
    <g class="win win-main">
      <rect x="3" y="6" width="330" height="206" rx="10" fill="#000" opacity="0.5" filter="url(#blurSm)"/>
      <rect x="0" y="0" width="330" height="206" rx="10" fill="#0d1017" fill-opacity="0.98" stroke="#1e2a3a" stroke-width="1"/>
      <rect x="0" y="0" width="330" height="22" rx="10" fill="#131924"/>
      <rect x="0" y="14" width="330" height="8" fill="#131924"/>
      <circle cx="13" cy="11" r="4" fill="#ff5f57"/>
      <circle cx="26" cy="11" r="4" fill="#febc2e"/>
      <circle cx="39" cy="11" r="4" fill="#28c840"/>
      <text x="165" y="15" text-anchor="middle" class="win-title">zsh — heloisa@macbook</text>

      <g transform="translate(14,38)" class="mono">
        <text x="0" y="0"><tspan class="prompt">➜</tspan><tspan fill="#a6e3a1" dx="4">~</tspan><tspan fill="#89b4fa" dx="4">git:(</tspan><tspan fill="#f38ba8">main</tspan><tspan fill="#89b4fa">)</tspan></text>
        <text x="0" y="18"><tspan class="prompt">$</tspan><tspan dx="6">whoami</tspan><tspan class="str" dx="4">--role</tspan></text>
        <text x="0" y="38" fill="#cdd6f4">Heloisa Pe Garcia</text>
        <text x="0" y="54" fill="#cdd6f4">Software Developer · DevOps &amp; Cloud</text>
        <line x1="0" y1="64" x2="300" y2="64" stroke="#1e293b" stroke-width="0.7"/>
        <text x="0" y="82"><tspan class="prompt">$</tspan><tspan dx="6">kubectl apply</tspan><tspan class="str" dx="4">-f deploy.yaml</tspan></text>
        <text x="0" y="100" class="ok">✔ 3/3 replicas ready ⚡</text>
        <text x="0" y="118"><tspan class="prompt">$</tspan><tspan dx="6">open</tspan><tspan class="str" dx="4">--new-ideas</tspan></text>
        <text x="0" y="136" class="comment"># loading next project...</text>
        <rect x="0" y="144" width="7" height="12" fill="#89b4fa" class="cursor"/>
